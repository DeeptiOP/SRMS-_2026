services:
  - type: web
    name: srms-app
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        sync: false  # Set this in Render dashboard
      - key: WTF_CSRF_SECRET_KEY
        sync: false  # Set this in Render dashboard
      - key: ADMIN_REGISTRATION_KEY
        sync: false  # Set this in Render dashboard
      - key: DB_HOST
        sync: false  # Will be set from Railway
      - key: DB_USER
        sync: false  # Will be set from Railway
      - key: DB_PASSWORD
        sync: false  # Will be set from Railway
      - key: DB_NAME
        sync: false  # Will be set from Railway
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: app.log